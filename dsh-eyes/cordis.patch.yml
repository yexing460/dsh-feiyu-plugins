# dsh-eyes
# 装到 profile 后会把工具 eyes 注册进来。
#
# 配置全可省略。默认：每 3 秒一张、能回看最近 10 分钟。
- insert:
    - id: eyes
      name: dsh-eyes
      config:
        interval: 3          # 每隔几秒截一张（太密会拖慢机器）
        keepMinutes: 10      # 能回看最近多久（分钟）——人关心的是这个
        # keep: 200          # 旧写法：直接指定留几张；给了 keepMinutes 就不看它
        # dir: 'D:\eyes'     # 截图放哪，留空用系统临时目录
